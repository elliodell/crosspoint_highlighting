name: X4 Pro highlighting firmware
on:
  push:
    branches: [main, feat/power-highlights]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x4pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
      - name: Install pinned build tools
        run: |
          uv pip install --system 'https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip'
          uv pip install --system 'littlefs-python>=0.16.0' 'fatfs-ng>=0.1.14' 'pyyaml>=6.0.2' 'rich-click>=1.8.6' 'zopfli>=0.2.2' 'intelhex>=2.3.0' 'rich>=14.0.0' 'urllib3<2' 'cryptography>=45.0.3' 'certifi>=2025.8.3' 'ecdsa>=0.19.1' 'bitstring>=4.3.1' 'reedsolo>=1.5.3,<1.8' 'esp-idf-size>=2.0.0' 'esp-coredump>=1.14.0'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: highlighting-x4pro-${{ hashFiles('platformio.ini', 'scripts/patch_*.py') }}
      - name: Capture regression checks
        run: |
          sh test/highlights/run.sh
          python3 test/test_power_highlight.py
          python3 test/test_pending_highlight.py
      - name: Build X4 Pro
        run: pio run -e x4pro -j2
      - name: Readwise retry checks
        run: sh test/readwise_sync/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: crosspoint-highlighting-x4pro
          path: |
            .pio/build/x4pro/firmware.bin
            sd-card/
            docs/INSTALL.md
